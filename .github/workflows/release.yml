name: release
on:
  push:
    tags: ['*']
jobs:
  publish:
    # The tool package is RID agnostic, so there is nothing to gain from a Windows runner here. ci
    # is what covers the three platforms.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Lets the job mint the OIDC token nuget.org trades for a short-lived publishing key.
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      # The tag is the version: tag 1.2.3 (or v1.2.3) publishes 1.2.3. The Version in
      # Directory.Build.props is only what local builds get.
      - name: Resolve the version from the tag
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      # The build is the pack: ProjectDefaults sets GeneratePackageOnBuild for a package project in
      # Release and drops the nupkg in ./nugets. A separate dotnet pack would build it a second
      # time, and on a solution it races with GeneratePackageOnBuild.
      - name: Build and pack
        run: dotnet build src -c Release -p:Version=${{ env.version }}
      - name: Test
        run: dotnet test src -c Release --no-build --no-restore
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: nugets/*.nupkg
      # Trusted publishing: no stored API key. nuget.org validates GitHub's OIDC token against the
      # policy naming this repository and this workflow file, and returns a key good for an hour —
      # so this stays immediately before the push.
      - name: NuGet login
        id: login
        uses: NuGet/login@v1
        with:
          # The nuget.org account the trusted publishing policy belongs to.
          user: SimonCropp
      - name: Push to nuget.org
        shell: bash
        run: >
          dotnet nuget push nugets/*.nupkg
          --api-key ${{ steps.login.outputs.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
